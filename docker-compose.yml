services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web/public:/var/www/public:ro
      - web-storage:/var/www/storage:ro
    depends_on: [laravel]
  laravel: &laravel
    build: {context: ., dockerfile: docker/php/Dockerfile}
    env_file: .env
    volumes:
      - ./.env:/var/www/.env
      - ./apps/web/public:/var/www/public
      - web-storage:/var/www/storage
      - shared-audio:/shared/audio-clips
    healthcheck: {test: ["CMD-SHELL", "php artisan about >/dev/null || exit 1"], interval: 15s, timeout: 5s, retries: 5}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  laravel-worker:
    <<: *laravel
    command: php artisan queue:work --sleep=2 --tries=3 --timeout=90
  laravel-scheduler:
    <<: *laravel
    command: php artisan schedule:work
  discord-manager:
    build: {context: ., dockerfile: docker/node/Dockerfile, args: {APP_NAME: discord-manager}}
    env_file: .env
    volumes:
      - web-storage:/var/www/storage
      - shared-audio:/shared/audio-clips
    deploy: {replicas: 1}
    depends_on: {nginx: {condition: service_started}, laravel: {condition: service_healthy}, redis: {condition: service_healthy}}
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: voice_guardian, POSTGRES_USER: voice_guardian, POSTGRES_PASSWORD: "${DB_PASSWORD}"}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U voice_guardian"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
volumes: {postgres-data: {}, redis-data: {}, web-storage: {}, shared-audio: {}}
