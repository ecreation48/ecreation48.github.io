server { listen 80; root /var/www/public; index index.php; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; location / { try_files $uri $uri/ /index.php?$query_string; } location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/public/index.php; fastcgi_pass laravel:9000; } location ~ /\. { deny all; } }
